name: AI Praktika - avtomatik post

"on":
  schedule:
    # Barcha vaqtlar UTC. Toshkent = UTC+5, shuning uchun postdan 10 daqiqa oldin ishga tushadi:
    # 08:50 Toshkent -> 03:50 UTC (09:00 dagi post uchun)
    - cron: "50 3 * * *"
    # 12:50 Toshkent -> 07:50 UTC (13:00 dagi post uchun)
    - cron: "50 7 * * *"
    # 17:50 Toshkent -> 12:50 UTC (18:00 dagi post uchun)
    - cron: "50 12 * * *"
  workflow_dispatch: {}  # "Run workflow" tugmasi orqali istalgan vaqtda qo'lda ishga tushirish

permissions:
  contents: write

concurrency:
  group: ai-praktika-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Pipeline'ni ishga tushirish
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AISHA_API_KEY: ${{ secrets.AISHA_API_KEY }}
          CHANNEL_USERNAME: ${{ vars.CHANNEL_USERNAME }}
          ADMIN_CHAT_ID: ${{ vars.ADMIN_CHAT_ID }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          AISHA_MOOD: ${{ vars.AISHA_MOOD }}
          WAIT_MINUTES: ${{ vars.WAIT_MINUTES }}
        run: python main.py

      - name: Mavzular tarixini saqlab qo'yish (commit)
        run: |
          git config user.name "ai-praktika-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update topic history [skip ci]"
            git push
          else
            echo "O'zgarish yo'q, commit qilinmadi."
          fi
